# Native Ubuntu Mosquitto (apt) — no Docker
# Install:
#   sudo cp milesight.conf /etc/mosquitto/conf.d/milesight.conf
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd root   # set password interactively
#   # or non-interactive:
#   # sudo mosquitto_passwd -b -c /etc/mosquitto/passwd root 'YOUR_PASSWORD'
#   sudo chown root:mosquitto /etc/mosquitto/passwd
#   sudo chmod 640 /etc/mosquitto/passwd
#   sudo systemctl restart mosquitto

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd

persistence true
persistence_location /var/lib/mosquitto/

# Logs via journald: journalctl -u mosquitto -f
log_dest syslog
log_type error
log_type warning
log_type notice
log_type information
